services:
  federation-learning-runtime-engine:
    build:
      context: .
      dockerfile: ./docker/pytorch/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-python:3.11-slim}
        PLUGIN_PROFILE: ${RUNTIME_ENGINE_PLUGIN_PROFILE:-full}
        TORCH_RUNTIME: ${TORCH_RUNTIME:-cpu}
    image: ${RUNTIME_ENGINE_IMAGE:-fl/federation-learning-runtime-engine:full-0.0.1-SNAPSHOT}
