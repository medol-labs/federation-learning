runtime-agent:
  bootstrap:
    enabled: ${RUNTIME_AGENT_BOOTSTRAP_ENABLED:true}
    runtime-agent-id: ${RUNTIME_AGENT_ID:}
    runtime-infrastructure-id: ${RUNTIME_INFRASTRUCTURE_ID:}
    agent-version: ${RUNTIME_AGENT_VERSION:local-dev}
  platform-connection-reporting:
    enabled: ${RUNTIME_AGENT_PLATFORM_CONNECTION_REPORTING_ENABLED:true}
    platform-url: ${FEDERATION_LEARNING_PLATFORM_URL:http://localhost:8081}
    agent-install-mode: ${RUNTIME_AGENT_INSTALL_MODE:MANUAL_GUIDED}
    organization-id: ${RUNTIME_AGENT_ORGANIZATION_ID:}
    runtime-name: ${RUNTIME_AGENT_RUNTIME_NAME:}
    runtime-agent-endpoint: ${RUNTIME_AGENT_ENDPOINT:http://localhost:8082}
    endpoint-scope: ${RUNTIME_AGENT_ENDPOINT_SCOPE:LOCAL}
  csv-dataset:
    label-columns: ${RUNTIME_AGENT_CSV_DATASET_LABEL_COLUMNS:readmission_risk}
  feature-schema-lookup:
    enabled: ${RUNTIME_AGENT_FEATURE_SCHEMA_LOOKUP_ENABLED:true}
    platform-url: ${FEDERATION_LEARNING_PLATFORM_URL:http://localhost:8081}
  dataset-metadata-reporting:
    enabled: ${RUNTIME_AGENT_DATASET_METADATA_REPORTING_ENABLED:true}
    platform-url: ${FEDERATION_LEARNING_PLATFORM_URL:http://localhost:8081}
  local-model-update-submission:
    enabled: ${RUNTIME_AGENT_LOCAL_MODEL_UPDATE_SUBMISSION_ENABLED:true}
    platform-url: ${FEDERATION_LEARNING_PLATFORM_URL:http://localhost:8081}
    support-url: ${FEDERATION_LEARNING_SUPPORT_URL:http://localhost:8080}
    internal-token: ${MEDOL_SECURITY_INTERNAL_TOKEN:local-dev-internal-token}
  local-runtime-engine:
    enabled: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_ENABLED:true}
    compose-file: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_COMPOSE_FILE:../../federation-learning-runtime-engine/docker-compose.yml}
    project-name: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_PROJECT_NAME:federation-learning-runtime-engine}
    service-name: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_SERVICE_NAME:federation-learning-runtime-engine}
    endpoint: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_ENDPOINT:http://localhost:18080}
    node-name: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_NODE_NAME:local-runtime}
    runtime-root: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_RUNTIME_ROOT:/workspace/tmp/runtime-engine}
    runtime-root-host-root: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_RUNTIME_ROOT_HOST_ROOT:../../volumes/tmp/runtime-engine}
    dataset-host-root: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_DATASET_HOST_ROOT:../../volumes/datasets}
    dataset-container-root: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_DATASET_CONTAINER_ROOT:/workspace/datasets}
    label-column: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_LABEL_COLUMN:readmission_risk}
    id-column: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_ID_COLUMN:id}
    epoch: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_EPOCH:1}
    learning-rate: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_LEARNING_RATE:0.1}
    command-timeout: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_COMMAND_TIMEOUT:PT2M}
    health-timeout: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_HEALTH_TIMEOUT:PT30S}
    health-poll-interval: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_HEALTH_POLL_INTERVAL:PT1S}
    job-observation-timeout: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_JOB_OBSERVATION_TIMEOUT:PT5M}
    job-observation-poll-interval: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_JOB_OBSERVATION_POLL_INTERVAL:PT2S}
