services:
  postgres:
    image: postgres:16
    ports:
      - "${DB_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: medol
      POSTGRES_PASSWORD: medol
      POSTGRES_DB: federation_learning_runtime_agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medol -d federation_learning_runtime_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # axon-server:
  #   image: axoniq/axonserver:2026.0.3-jdk-21
  #   hostname: axon-server
  #   profiles:
  #     - axon-server
  #   ports:
  #     - "${AXON_SERVER_HTTP_PORT:-8024}:8024"
  #     - "${AXON_SERVER_GRPC_PORT:-8124}:8124"
  #   environment:
  #     axoniq_axonserver_hostname: axon-server
  #     axoniq_axonserver_autocluster_first: axon-server
  #     axoniq_axonserver_autocluster_dcb: "true"
  #     axoniq_axonserver_autocluster_contexts: _admin,default
  #   volumes:
  #     - axon_server_data:/axonserver/data
  #     - axon_server_events:/axonserver/events
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8024/actuator/health"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10
  #     start_period: 30s

  umadb:
    image: umadb/umadb:0.7.8
    ports:
      - "${UMADB_PORT:-50053}:50051"
    volumes:
      - umadb_data:/data

  federation-learning-runtime-agent:
    image: ${APP_IMAGE:-medol/federation-learning-runtime-agent:0.0.1-SNAPSHOT}
    profiles:
      - application
    depends_on:
      postgres:
        condition: service_healthy
      umadb:
        condition: service_started
    ports:
      - "${APP_PORT:-8082}:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      DB_URL: jdbc:postgresql://postgres:5432/federation_learning_runtime_agent
      DB_USERNAME: medol
      DB_PASSWORD: medol
      MEDOL_AXON_EVENT_STORAGE: ${MEDOL_AXON_EVENT_STORAGE:-umadb}
      UMADB_TARGET: ${UMADB_TARGET:-umadb:50051}
      UMADB_PLAINTEXT: ${UMADB_PLAINTEXT:-true}
      UMADB_API_KEY: ${UMADB_API_KEY:-}
      UMADB_BATCH_SIZE: ${UMADB_BATCH_SIZE:-256}
      UMADB_REQUEST_TIMEOUT: ${UMADB_REQUEST_TIMEOUT:-PT10S}
      AXON_SERVER_ENABLED: "false"
      AXON_SERVER_EVENT_STORE_ENABLED: "false"
      AXON_UPDATE_CHECK_DISABLED: ${AXON_UPDATE_CHECK_DISABLED:-true}
      FEDERATION_LEARNING_SUPPORT_URL: ${FEDERATION_LEARNING_SUPPORT_URL:-}
      FEDERATION_LEARNING_PLATFORM_URL: ${FEDERATION_LEARNING_PLATFORM_URL:-}
      RUNTIME_AGENT_ID: ${RUNTIME_AGENT_ID:-2336adf7-e0d4-5d84-81f8-86b68248047a}
      RUNTIME_INFRASTRUCTURE_ID: ${RUNTIME_INFRASTRUCTURE_ID:-601bc69e-367c-3a2c-bf1c-e34c4184d350}
      RUNTIME_AGENT_VERSION: ${RUNTIME_AGENT_VERSION:-local-medical-dev}
      RUNTIME_AGENT_ORGANIZATION_ID: ${RUNTIME_AGENT_ORGANIZATION_ID:-cca3332b-052d-5710-a8fe-2ac03911012b}
      RUNTIME_AGENT_RUNTIME_NAME: ${RUNTIME_AGENT_RUNTIME_NAME:-local-medical-runtime}
      RUNTIME_AGENT_ENDPOINT: ${RUNTIME_AGENT_ENDPOINT:-http://localhost:8082}
      RUNTIME_AGENT_ENDPOINT_SCOPE: ${RUNTIME_AGENT_ENDPOINT_SCOPE:-LOCAL_DEV}
      RUNTIME_AGENT_INSTALL_MODE: ${RUNTIME_AGENT_INSTALL_MODE:-MANUAL}
      RUNTIME_AGENT_CSV_DATASET_LABEL_COLUMNS: ${RUNTIME_AGENT_CSV_DATASET_LABEL_COLUMNS:-readmission_risk}
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_NODE_NAME: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_NODE_NAME:-local-medical-runtime}
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_LABEL_COLUMN: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_LABEL_COLUMN:-readmission_risk}
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_ID_COLUMN: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_ID_COLUMN:-id}

volumes:
  postgres_data:
  axon_server_data:
  axon_server_events:
  umadb_data:
