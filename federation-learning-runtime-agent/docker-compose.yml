services:
  postgres:
    image: postgres:16
    platform: ${DOCKER_PLATFORM:-}
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: medol
      POSTGRES_PASSWORD: medol
      POSTGRES_DB: federation_learning_runtime_agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medol -d federation_learning_runtime_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # axon-server:
  #   image: axoniq/axonserver:2026.0.3-jdk-21
  #   hostname: axon-server
  #   profiles:
  #     - axon-server
  #   ports:
  #     - "${AXON_SERVER_HTTP_PORT:-8024}:8024"
  #     - "${AXON_SERVER_GRPC_PORT:-8124}:8124"
  #   environment:
  #     axoniq_axonserver_hostname: axon-server
  #     axoniq_axonserver_autocluster_first: axon-server
  #     axoniq_axonserver_autocluster_dcb: "true"
  #     axoniq_axonserver_autocluster_contexts: _admin,default
  #   volumes:
  #     - axon_server_data:/axonserver/data
  #     - axon_server_events:/axonserver/events
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8024/actuator/health"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10
  #     start_period: 30s

  umadb:
    image: umadb/umadb:0.7.8
    platform: ${DOCKER_PLATFORM:-}
    restart: unless-stopped
    ports:
      - "${UMADB_PORT:-50053}:50051"
    volumes:
      - umadb_data:/data

  federation-learning-runtime-agent:
    image: ${APP_IMAGE:-medol/federation-learning-runtime-agent:0.0.1-SNAPSHOT}
    platform: ${DOCKER_PLATFORM:-}
    restart: unless-stopped
    profiles:
      - application
    depends_on:
      postgres:
        condition: service_healthy
      umadb:
        condition: service_started
    ports:
      - "${APP_PORT:-8082}:8082"
    volumes:
      - ${RUNTIME_AGENT_DATASETS_DIR:-../../volumes/datasets}:/workspace/datasets
    environment:
      SERVER_PORT: 8082
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      DB_URL: jdbc:postgresql://postgres:5432/federation_learning_runtime_agent
      DB_USERNAME: medol
      DB_PASSWORD: medol
      MEDOL_SECURITY_ENABLED: ${MEDOL_SECURITY_ENABLED:-true}
      MEDOL_SECURITY_PROVIDER: ${MEDOL_SECURITY_PROVIDER:-local}
      MEDOL_SECURITY_JWT_SECRET: ${MEDOL_SECURITY_JWT_SECRET:-change-me-change-me-change-me-change-me}
      MEDOL_SECURITY_LOCAL_TOKEN_TTL_SECONDS: ${MEDOL_SECURITY_LOCAL_TOKEN_TTL_SECONDS:-28800}
      MEDOL_SECURITY_ALLOWED_ORIGINS: ${MEDOL_SECURITY_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
      MEDOL_SECURITY_INTERNAL_TOKEN: ${MEDOL_SECURITY_INTERNAL_TOKEN:-local-dev-internal-token}
      MEDOL_SECURITY_INTERNAL_SUBJECT: ${MEDOL_SECURITY_INTERNAL_SUBJECT:-00000000-0000-0000-0000-000000000001}
      MEDOL_SECURITY_INTERNAL_USERNAME: ${MEDOL_SECURITY_INTERNAL_USERNAME:-internal-service}
      MEDOL_SECURITY_INTERNAL_ROLES: ${MEDOL_SECURITY_INTERNAL_ROLES:-SERVICE}
      MEDOL_SECURITY_INTERNAL_PERMISSIONS: ${MEDOL_SECURITY_INTERNAL_PERMISSIONS:-*:*}
      MEDOL_SECURITY_ADMIN_BOOTSTRAP_ENABLED: ${MEDOL_SECURITY_ADMIN_BOOTSTRAP_ENABLED:-false}
      MEDOL_SECURITY_ADMIN_BOOTSTRAP_SETUP_TOKEN: ${MEDOL_SECURITY_ADMIN_BOOTSTRAP_SETUP_TOKEN:-}
      SUPABASE_JWT_ISSUER_URI: ${SUPABASE_JWT_ISSUER_URI:-}
      SUPABASE_JWT_JWK_SET_URI: ${SUPABASE_JWT_JWK_SET_URI:-}
      MEDOL_AXON_EVENT_STORAGE: ${MEDOL_AXON_EVENT_STORAGE:-umadb}
      UMADB_TARGET: ${APP_UMADB_TARGET:-umadb:50051}
      UMADB_PLAINTEXT: ${UMADB_PLAINTEXT:-true}
      UMADB_API_KEY: ${UMADB_API_KEY:-}
      UMADB_BATCH_SIZE: ${UMADB_BATCH_SIZE:-256}
      UMADB_REQUEST_TIMEOUT: ${UMADB_REQUEST_TIMEOUT:-PT10S}
      AXON_SERVER_ENABLED: "false"
      AXON_SERVER_EVENT_STORE_ENABLED: "false"
      AXON_UPDATE_CHECK_DISABLED: ${AXON_UPDATE_CHECK_DISABLED:-true}
      FEDERATION_LEARNING_SUPPORT_URL: ${FEDERATION_LEARNING_SUPPORT_URL:-}
      FEDERATION_LEARNING_PLATFORM_URL: ${FEDERATION_LEARNING_PLATFORM_URL:-}
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_ENABLED: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_ENABLED:-true}
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_COMPOSE_FILE: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_COMPOSE_FILE:-../../federation-learning-runtime-engine/docker-compose.yml}
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_PROJECT_NAME: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_PROJECT_NAME:-runtime-engine}
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_SERVICE_NAME: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_SERVICE_NAME:-runtime-engine}
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_ENDPOINT: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_ENDPOINT:-http://localhost:18080}
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_NODE_NAME: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_NODE_NAME:-local-runtime}
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_RUNTIME_ROOT: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_RUNTIME_ROOT:-/workspace/tmp/runtime-engine}
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_RUNTIME_ROOT_HOST_ROOT: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_RUNTIME_ROOT_HOST_ROOT:-../../volumes/tmp/runtime-engine}
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_DATASET_HOST_ROOT: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_DATASET_HOST_ROOT:-/workspace/datasets}
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_DATASET_CONTAINER_ROOT: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_DATASET_CONTAINER_ROOT:-/workspace/datasets}
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_LABEL_COLUMN: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_LABEL_COLUMN:-readmission_risk}
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_ID_COLUMN: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_ID_COLUMN:-id}
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_MODEL: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_MODEL:-linear.LogisticRegression}
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_EPOCH: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_EPOCH:-1}
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_LEARNING_RATE: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_LEARNING_RATE:-0.1}
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_COMMAND_TIMEOUT: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_COMMAND_TIMEOUT:-PT2M}
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_HEALTH_TIMEOUT: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_HEALTH_TIMEOUT:-PT30S}
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_HEALTH_POLL_INTERVAL: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_HEALTH_POLL_INTERVAL:-PT1S}
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_JOB_OBSERVATION_TIMEOUT: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_JOB_OBSERVATION_TIMEOUT:-PT5M}
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_JOB_OBSERVATION_POLL_INTERVAL: ${RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_JOB_OBSERVATION_POLL_INTERVAL:-PT2S}

volumes:
  postgres_data:
  axon_server_data:
  axon_server_events:
  umadb_data:
