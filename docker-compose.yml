services:
  axon-server:
    image: axoniq/axonserver:2026.0.3-jdk-21
    hostname: axon-server
    profiles:
      - axon-server
    ports:
      - "${AXON_SERVER_HTTP_PORT:-8024}:8024"
      - "${AXON_SERVER_GRPC_PORT:-8124}:8124"
    environment:
      axoniq_axonserver_hostname: axon-server
      axoniq_axonserver_autocluster_first: axon-server
      axoniq_axonserver_autocluster_dcb: "true"
      axoniq_axonserver_autocluster_contexts: _admin,default
    volumes:
      - axon_server_data:/axonserver/data
      - axon_server_events:/axonserver/events
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8024/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  umadb:
    image: umadb/umadb:latest
    ports:
      - "50051:50051"
    volumes:
      - umadb_data:/data

  federation-learning-dictionary-postgres:
    image: postgres:16
    ports:
      - "${FEDERATION_LEARNING_DICTIONARY_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: medol
      POSTGRES_PASSWORD: medol
      POSTGRES_DB: federation_learning_dictionary
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medol -d federation_learning_dictionary"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - federation-learning-dictionary_postgres_data:/var/lib/postgresql/data

  federation-learning-platform-postgres:
    image: postgres:16
    ports:
      - "${FEDERATION_LEARNING_PLATFORM_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: medol
      POSTGRES_PASSWORD: medol
      POSTGRES_DB: federation_learning_platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medol -d federation_learning_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - federation-learning-platform_postgres_data:/var/lib/postgresql/data

  federation-learning-runtime-agent-postgres:
    image: postgres:16
    ports:
      - "${FEDERATION_LEARNING_RUNTIME_AGENT_DB_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: medol
      POSTGRES_PASSWORD: medol
      POSTGRES_DB: federation_learning_runtime_agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medol -d federation_learning_runtime_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - federation-learning-runtime-agent_postgres_data:/var/lib/postgresql/data

volumes:
  axon_server_data:
  axon_server_events:
  umadb_data:
  federation-learning-dictionary_postgres_data:
  federation-learning-platform_postgres_data:
  federation-learning-runtime-agent_postgres_data:
