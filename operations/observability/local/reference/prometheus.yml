global:
  scrape_interval: "15s"
  evaluation_interval: "15s"
rule_files:
  - "/etc/prometheus/alerts.yml"
scrape_configs:
  - job_name: "otel-applications"
    honor_labels: true
    static_configs:
      - targets:
          - "collector:8889"
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
