services:
  collector:
    image: "otel/opentelemetry-collector-contrib:0.165.0"
    restart: "unless-stopped"
    command:
      - "--config=/etc/otelcol/config.yml"
    volumes:
      - "./collector.yml:/etc/otelcol/config.yml:ro"
    mem_limit: "512m"
    ports:
      - "127.0.0.1:${OTLP_HTTP_PORT:-14318}:4318"
  prometheus:
    image: "prom/prometheus:v3.16.0"
    restart: "unless-stopped"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=5GB"
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "./alerts.yml:/etc/prometheus/alerts.yml:ro"
      - "prometheus_data:/prometheus"
    mem_limit: "1g"
  loki:
    image: "grafana/loki:3.7.10"
    restart: "unless-stopped"
    command:
      - "-config.file=/etc/loki/config.yml"
    volumes:
      - "./loki.yml:/etc/loki/config.yml:ro"
      - "loki_data:/loki"
    mem_limit: "1g"
  tempo:
    image: "grafana/tempo:3.1.1"
    restart: "unless-stopped"
    command:
      - "-target=all"
      - "-config.file=/etc/tempo/config.yml"
    volumes:
      - "./tempo.yml:/etc/tempo/config.yml:ro"
      - "tempo_data:/var/tempo"
    mem_limit: "1g"
  grafana:
    image: "grafana/grafana:13.3.1"
    restart: "unless-stopped"
    volumes:
      - "grafana_data:/var/lib/grafana"
      - "./datasources.yml:/etc/grafana/provisioning/datasources/reference.yml:ro"
      - "./dashboards.yml:/etc/grafana/provisioning/dashboards/reference.yml:ro"
      - "./overview.json:/var/lib/grafana/dashboards/overview.json:ro"
    mem_limit: "1g"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-13000}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
volumes:
  prometheus_data: {}
  loki_data: {}
  tempo_data: {}
  grafana_data: {}
