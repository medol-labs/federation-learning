receivers:
  otlp:
    protocols:
      http:
        endpoint: "0.0.0.0:4318"
      grpc:
        endpoint: "0.0.0.0:4317"
processors:
  memory_limiter:
    check_interval: "1s"
    limit_mib: 384
    spike_limit_mib: 64
  batch:
    timeout: "5s"
exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    enable_open_metrics: true
  "otlp_http/loki":
    endpoint: "http://loki:3100/otlp"
    retry_on_failure:
      enabled: true
      max_elapsed_time: "60s"
    sending_queue:
      enabled: true
      queue_size: 1000
  "otlp_grpc/tempo":
    endpoint: "tempo:4317"
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      max_elapsed_time: "60s"
    sending_queue:
      enabled: true
      queue_size: 1000
extensions:
  health_check:
    endpoint: "0.0.0.0:13133"
service:
  extensions:
    - "health_check"
  pipelines:
    metrics:
      receivers:
        - "otlp"
      processors:
        - "memory_limiter"
        - "batch"
      exporters:
        - "prometheus"
    logs:
      receivers:
        - "otlp"
      processors:
        - "memory_limiter"
        - "batch"
      exporters:
        - "otlp_http/loki"
    traces:
      receivers:
        - "otlp"
      processors:
        - "memory_limiter"
        - "batch"
      exporters:
        - "otlp_grpc/tempo"
