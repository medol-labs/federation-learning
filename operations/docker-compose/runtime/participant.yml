services:
  federation-learning-runtime-agent:
    environment:
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_MODE: prestarted
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_PRESTARTED_IMAGE: ${PARTICIPANT_ENGINE_IMAGE:?Set PARTICIPANT_ENGINE_IMAGE}
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_ENDPOINT: http://training-engine:8080
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_NODE_NAME: ${PARTICIPANT_ENGINE_NODE_NAME:-participant-runtime}
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_DATASET_HOST_ROOT: /workspace/datasets
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_DATASET_CONTAINER_ROOT: /workspace/datasets
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_RUNTIME_ROOT: /workspace/tmp/runtime-engine
      RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_RUNTIME_ROOT_HOST_ROOT: /workspace/tmp/runtime-engine
    depends_on:
      training-engine:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${PARTICIPANT_DATASETS_DIR:?Set PARTICIPANT_DATASETS_DIR}
        target: /workspace/datasets
        read_only: true
        bind:
          create_host_path: false
      - training-work:/workspace/tmp/runtime-engine
  training-engine:
    image: ${PARTICIPANT_ENGINE_IMAGE:?Set PARTICIPANT_ENGINE_IMAGE}
    restart: unless-stopped
    environment:
      RUNTIME_ENGINE_HOST: 0.0.0.0
      RUNTIME_ENGINE_PORT: "8080"
      RUNTIME_ENGINE_NODE_NAME: ${PARTICIPANT_ENGINE_NODE_NAME:-participant-runtime}
      RUNTIME_ENGINE_ROOT: /workspace/tmp/runtime-engine
      RUNTIME_ENGINE_PLUGIN_PROFILE: ${PARTICIPANT_ENGINE_PLUGIN_PROFILE:-pytorch-vision}
      RUNTIME_ENGINE_FILE_ACCESS_BASE_URL: ${FEDERATION_LEARNING_SUPPORT_URL:?Set reachable support API URL}
      MEDOL_SECURITY_INTERNAL_TOKEN: ${MEDOL_SECURITY_INTERNAL_TOKEN:?Set MEDOL_SECURITY_INTERNAL_TOKEN}
    volumes:
      - type: bind
        source: ${PARTICIPANT_DATASETS_DIR:?Set PARTICIPANT_DATASETS_DIR}
        target: /workspace/datasets
        read_only: true
        bind:
          create_host_path: false
      - training-work:/workspace/tmp/runtime-engine
    networks: [medol-network]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 24
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-5}"
volumes:
  training-work: {}
