apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "federation-learning-runtime-agent"
spec:
  template:
    spec:
      containers:
        - name: "federation-learning-runtime-agent"
          envFrom:
            - configMapRef:
                name: "federation-learning-runtime-agent-local-config"
            - secretRef:
                name: "federation-learning-runtime-agent-local-secret"
                optional: true
