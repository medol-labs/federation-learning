apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "medol-observability"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "10Gi"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "medol-observability"
spec:
  replicas: 1
  strategy:
    type: "Recreate"
  selector:
    matchLabels:
      app: "medol-observability"
  template:
    metadata:
      labels:
        app: "medol-observability"
    spec:
      containers:
        - name: "medol-observability"
          image: "grafana/otel-lgtm:0.41.0"
          ports:
            - name: "otlp-http"
              containerPort: 4318
            - name: "grafana"
              containerPort: 3000
          env:
            - name: "GF_AUTH_ANONYMOUS_ENABLED"
              value: "false"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: "data"
              mountPath: "/data"
      volumes:
        - name: "data"
          persistentVolumeClaim:
            claimName: "medol-observability"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "medol-observability"
spec:
  type: "ClusterIP"
  selector:
    app: "medol-observability"
  ports:
    - name: "otlp-http"
      port: 4318
      targetPort: 4318
    - name: "grafana"
      port: 3000
      targetPort: 3000
