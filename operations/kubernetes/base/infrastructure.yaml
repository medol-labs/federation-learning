apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "postgres-init"
  labels:
    "app.kubernetes.io/name": "postgres-init"
    "app.kubernetes.io/component": "infrastructure"
    "app.kubernetes.io/managed-by": "medol-operations-generator"
data:
  "01-create-databases.sql": "-- Generated by the Medol operations generator.\n-- This file runs during the first PostgreSQL container initialization.\nSELECT 'CREATE DATABASE \"federation_learning_platform\";' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'federation_learning_platform')\\gexec\nSELECT 'CREATE DATABASE \"federation_learning_runtime_agent\";' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'federation_learning_runtime_agent')\\gexec\nSELECT 'CREATE DATABASE \"federation_learning_support\";' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'federation_learning_support')\\gexec\n"
---
apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "postgres-data"
  labels:
    "app.kubernetes.io/name": "postgres-data"
    "app.kubernetes.io/component": "infrastructure"
    "app.kubernetes.io/managed-by": "medol-operations-generator"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "1Gi"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "postgres"
  labels:
    "app.kubernetes.io/name": "postgres"
    "app.kubernetes.io/component": "infrastructure"
    "app.kubernetes.io/managed-by": "medol-operations-generator"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "postgres"
  template:
    metadata:
      labels:
        app: "postgres"
    spec:
      containers:
        - name: "postgres"
          image: "postgres:16"
          ports:
            - containerPort: 5432
          env:
            - name: "POSTGRES_USER"
              valueFrom:
                secretKeyRef:
                  name: "postgres-secret"
                  key: "username"
            - name: "POSTGRES_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "postgres-secret"
                  key: "password"
            - name: "POSTGRES_DB"
              value: "medol"
          volumeMounts:
            - name: "postgres-data"
              mountPath: "/var/lib/postgresql/data"
            - name: "postgres-init"
              mountPath: "/docker-entrypoint-initdb.d"
              readOnly: true
      volumes:
        - name: "postgres-data"
          persistentVolumeClaim:
            claimName: "postgres-data"
        - name: "postgres-init"
          configMap:
            name: "postgres-init"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "postgres"
  labels:
    "app.kubernetes.io/name": "postgres"
    "app.kubernetes.io/component": "service"
    "app.kubernetes.io/managed-by": "medol-operations-generator"
spec:
  type: "ClusterIP"
  selector:
    app: "postgres"
  ports:
    - name: "http"
      port: 5432
      targetPort: 5432
---
apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "umadb-data"
  labels:
    "app.kubernetes.io/name": "umadb-data"
    "app.kubernetes.io/component": "infrastructure"
    "app.kubernetes.io/managed-by": "medol-operations-generator"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "1Gi"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "umadb"
  labels:
    "app.kubernetes.io/name": "umadb"
    "app.kubernetes.io/component": "infrastructure"
    "app.kubernetes.io/managed-by": "medol-operations-generator"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "umadb"
  template:
    metadata:
      labels:
        app: "umadb"
    spec:
      containers:
        - name: "umadb"
          image: "umadb/umadb:0.7.8"
          ports:
            - containerPort: 50051
          volumeMounts:
            - name: "umadb-data"
              mountPath: "/data"
      volumes:
        - name: "umadb-data"
          persistentVolumeClaim:
            claimName: "umadb-data"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "umadb"
  labels:
    "app.kubernetes.io/name": "umadb"
    "app.kubernetes.io/component": "service"
    "app.kubernetes.io/managed-by": "medol-operations-generator"
spec:
  type: "ClusterIP"
  selector:
    app: "umadb"
  ports:
    - name: "http"
      port: 50051
      targetPort: 50051
