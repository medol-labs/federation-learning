imagePrefix: fl
frontend:
  supabaseUrl: ""
  environmentVariables:
    - name: VITE_AUTH_PROVIDER
      value: local
infrastructure:
  postgres:
    storageSize: 10Gi
  umadb:
    storageSize: 10Gi
networkTopology:
  sites:
    platform:
      title: Platform environment
      gateway: true
      applications:
        federation-learning-console: true
        federation-learning-platform: true
        federation-learning-support: true
      infrastructure:
        postgres: true
        umadb: true
    participant:
      title: Participant environment (per organization)
      gateway: true
      applications:
        federation-learning-participant-console: true
        federation-learning-runtime-agent: true
      infrastructure:
        postgres: true
        umadb: true
  connections:
    dispatch:
      from: federation-learning-platform
      to: federation-learning-runtime-agent
      protocol: HTTP
      label: Participant execution dispatch
    report:
      from: federation-learning-runtime-agent
      to: federation-learning-platform
      protocol: HTTP
      label: Runtime reporting and model updates
applications:
  federation-learning-support:
    servicePort: 8080
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "2", memory: 1536Mi}
    healthCheck:
      startupTimeoutSeconds: 180
  federation-learning-platform:
    servicePort: 8081
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "2", memory: 1536Mi}
    healthCheck:
      startupTimeoutSeconds: 180
  federation-learning-runtime-agent:
    servicePort: 8082
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "2", memory: 1536Mi}
    healthCheck:
      startupTimeoutSeconds: 180
