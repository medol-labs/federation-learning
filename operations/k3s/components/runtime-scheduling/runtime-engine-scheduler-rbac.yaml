apiVersion: v1
kind: ServiceAccount
metadata:
  name: federation-learning-platform-runtime-engine-scheduler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: federation-learning-platform-runtime-engine-scheduler
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: federation-learning-platform-runtime-engine-scheduler
subjects:
  - kind: ServiceAccount
    name: federation-learning-platform-runtime-engine-scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: federation-learning-platform-runtime-engine-scheduler
