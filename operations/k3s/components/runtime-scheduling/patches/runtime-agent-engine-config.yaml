apiVersion: v1
kind: ConfigMap
metadata:
  name: federation-learning-runtime-agent-dev-config
data:
  MEDOL_SYNC_ENABLED: "true"
  MEDOL_SYNC_FIXED_DELAY_MS: "5000"
  MEDOL_SYNC_MODE: outbox-delta
  MEDOL_SYNC_SOURCE_BASE_URL: http://federation-learning-platform:8081
  MEDOL_SYNC_SOURCE_BASE_URLS_DICTIONARYMAINTENANCE: http://federation-learning-support:8080
  RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_KUBERNETES_DATASET_HOST_PATH: /workspace/datasets
  RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_KUBERNETES_IMAGE: fl/federation-learning-runtime-engine:pytorch-vision-0.0.1-SNAPSHOT
  RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_KUBERNETES_IMAGE_PULL_POLICY: IfNotPresent
  RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_KUBERNETES_CONTAINER_PORT: "8080"
  RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_KUBERNETES_NAMESPACE: federation-learning-platform
  RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_KUBERNETES_RUNTIME_HOST_PATH: /workspace/tmp/runtime-engine
  RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_KUBERNETES_SERVICE_ACCOUNT_NAME: federation-learning-platform-runtime-engine-scheduler
  RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_RUNTIME_ROOT: /workspace/tmp/runtime-engine
  RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_RUNTIME_ROOT_HOST_ROOT: /workspace/tmp/runtime-engine
  RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_HEALTH_TIMEOUT: PT2M
  RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_JOB_OBSERVATION_TIMEOUT: PT10M
  RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_MODE: kubernetes
