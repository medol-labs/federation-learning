apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "federation-learning-platform"
spec:
  template:
    spec:
      containers:
        - name: "federation-learning-platform"
          envFrom:
            - configMapRef:
                name: "federation-learning-platform-test-config"
            - secretRef:
                name: "federation-learning-platform-test-secret"
                optional: true
