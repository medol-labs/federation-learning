apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "federation-learning-platform-dev-config"
data:
  PLATFORM_RUNTIME_K3S_AGENT_DEPLOYMENT_NAME: "federation-learning-runtime-agent-managed"
  PLATFORM_RUNTIME_K3S_AGENT_IMAGE: "medol/federation-learning-runtime-agent:0.0.1-SNAPSHOT"
  PLATFORM_RUNTIME_K3S_AGENT_REPLICAS: "1"
  PLATFORM_RUNTIME_K3S_AGENT_VERSION: "k3s"
  PLATFORM_RUNTIME_K3S_DATABASE_SECRET_NAME: "postgres-secret"
  PLATFORM_RUNTIME_K3S_DATABASE_URL: "jdbc:postgresql://postgres:5432/federation_learning_runtime_agent"
  PLATFORM_RUNTIME_K3S_ENDPOINT_SCOPE: "CLUSTER"
  PLATFORM_RUNTIME_K3S_NAMESPACE: "federation-learning-platform"
  PLATFORM_RUNTIME_K3S_PLATFORM_URL: "http://federation-learning-platform:8081"
  PLATFORM_RUNTIME_K3S_RENDERED_MANIFEST_DIRECTORY: "/tmp/runtime-agent-manifests"
  PLATFORM_RUNTIME_K3S_RUNTIME_ENGINE_DATASET_HOST_PATH: "/workspace/datasets"
  PLATFORM_RUNTIME_K3S_RUNTIME_ENGINE_IMAGE: "medol/federation-learning-runtime-engine:0.0.1-SNAPSHOT"
  PLATFORM_RUNTIME_K3S_RUNTIME_ENGINE_IMAGE_PULL_POLICY: "IfNotPresent"
  PLATFORM_RUNTIME_K3S_RUNTIME_ENGINE_SERVICE_ACCOUNT_NAME: "federation-learning-platform-runtime-engine-scheduler"
  PLATFORM_RUNTIME_K3S_RUNTIME_ENGINE_WORK_HOST_PATH: "/workspace/tmp/runtime-engine"
  PLATFORM_RUNTIME_K3S_SUPPORT_URL: "http://federation-learning-support:8080"
  PLATFORM_RUNTIME_K3S_UMADB_TARGET: "umadb:50051"
---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "federation-learning-runtime-agent-dev-config"
data:
  RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_KUBERNETES_DATASET_HOST_PATH: "/workspace/datasets"
  RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_KUBERNETES_IMAGE: "medol/federation-learning-runtime-engine:0.0.1-SNAPSHOT"
  RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_KUBERNETES_IMAGE_PULL_POLICY: "IfNotPresent"
  RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_KUBERNETES_NAMESPACE: "federation-learning-platform"
  RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_KUBERNETES_RUNTIME_HOST_PATH: "/workspace/tmp/runtime-engine"
  RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_KUBERNETES_SERVICE_ACCOUNT_NAME: "federation-learning-platform-runtime-engine-scheduler"
  RUNTIME_AGENT_LOCAL_RUNTIME_ENGINE_MODE: "kubernetes"
