apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "console"
  labels:
    "app.kubernetes.io/name": "console"
    "app.kubernetes.io/component": "frontend"
    "app.kubernetes.io/managed-by": "medol-operations-generator"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "console"
  template:
    metadata:
      labels:
        app: "console"
    spec:
      containers:
        - name: "console"
          image: "medol/federation-learning-platform-console:0.0.1-SNAPSHOT"
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: "/health"
              port: 80
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: "/health"
              port: 80
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "console"
  labels:
    "app.kubernetes.io/name": "console"
    "app.kubernetes.io/component": "service"
    "app.kubernetes.io/managed-by": "medol-operations-generator"
spec:
  type: "ClusterIP"
  selector:
    app: "console"
  ports:
    - name: "http"
      port: 80
      targetPort: 80
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "federation-learning-support"
  labels:
    "app.kubernetes.io/name": "federation-learning-support"
    "app.kubernetes.io/component": "backend"
    "app.kubernetes.io/managed-by": "medol-operations-generator"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "federation-learning-support"
  template:
    metadata:
      labels:
        app: "federation-learning-support"
    spec:
      containers:
        - name: "federation-learning-support"
          image: "medol/federation-learning-support:0.0.1-SNAPSHOT"
          ports:
            - containerPort: 8080
          env:
            - name: "DB_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "postgres-secret"
                  key: "password"
            - name: "DB_USERNAME"
              valueFrom:
                secretKeyRef:
                  name: "postgres-secret"
                  key: "username"
          readinessProbe:
            httpGet:
              path: "/actuator/health"
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
            initialDelaySeconds: 30
          livenessProbe:
            httpGet:
              path: "/actuator/health"
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
            initialDelaySeconds: 30
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "federation-learning-support"
  labels:
    "app.kubernetes.io/name": "federation-learning-support"
    "app.kubernetes.io/component": "service"
    "app.kubernetes.io/managed-by": "medol-operations-generator"
spec:
  type: "ClusterIP"
  selector:
    app: "federation-learning-support"
  ports:
    - name: "http"
      port: 8080
      targetPort: 8080
---
