server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import:
      - optional:classpath:application-infrastructure.yml
      - optional:file:./config/application-infrastructure.yml
      - optional:file:.env[.properties]
  application:
    name: federation-learning-dictionary
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:true}
      file: ${DOCKER_COMPOSE_FILE:docker-compose.yml}
      lifecycle-management: start-and-stop
      profiles:
        active: axon-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/federation_learning_dictionary}
    username: ${DB_USERNAME:medol}
    password: ${DB_PASSWORD:medol}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  flyway:
    enabled: true
    locations: classpath:db/migration

axon:
  update-check:
    disabled: ${AXON_UPDATE_CHECK_DISABLED:false}
  converter:
    general: jackson2
    messages: jackson2
    events: jackson2
  axonserver:
    enabled: ${AXON_SERVER_ENABLED:false}
    servers: ${AXON_SERVER_SERVERS:localhost:8124}
    context: ${AXON_SERVER_CONTEXT:default}
    event-store:
      enabled: ${AXON_SERVER_EVENT_STORE_ENABLED:true}

medol:
  axon:
    flow-logging:
      enabled: ${MEDOL_AXON_FLOW_LOGGING_ENABLED:true}
    event-storage: ${MEDOL_AXON_EVENT_STORAGE:umadb}
    umadb:
      target: ${UMADB_TARGET:localhost:50051}
      plaintext: ${UMADB_PLAINTEXT:true}
      api-key: ${UMADB_API_KEY:}
      batch-size: ${UMADB_BATCH_SIZE:256}
      request-timeout: ${UMADB_REQUEST_TIMEOUT:PT10S}

integration:
  federation-learning-platform:
    endpoint: ${FEDERATION_LEARNING_PLATFORM_URL:}
  federation-learning-runtime-agent:
    endpoint: ${FEDERATION_LEARNING_RUNTIME_AGENT_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    tech.medo.shared.application.axon: ${MEDOL_AXON_FLOW_LOG_LEVEL:INFO}
    org.axonframework: ${AXON_LOG_LEVEL:INFO}
