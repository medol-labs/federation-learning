services:
  postgres:
    image: postgres:16
    ports:
      - "${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: medol
      POSTGRES_PASSWORD: medol
      POSTGRES_DB: federation_learning_platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medol -d federation_learning_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # axon-server:
  #   image: axoniq/axonserver:2026.0.3-jdk-21
  #   hostname: axon-server
  #   profiles:
  #     - axon-server
  #   ports:
  #     - "${AXON_SERVER_HTTP_PORT:-8024}:8024"
  #     - "${AXON_SERVER_GRPC_PORT:-8124}:8124"
  #   environment:
  #     axoniq_axonserver_hostname: axon-server
  #     axoniq_axonserver_autocluster_first: axon-server
  #     axoniq_axonserver_autocluster_dcb: "true"
  #     axoniq_axonserver_autocluster_contexts: _admin,default
  #   volumes:
  #     - axon_server_data:/axonserver/data
  #     - axon_server_events:/axonserver/events
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8024/actuator/health"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10
  #     start_period: 30s

  umadb:
    image: umadb/umadb:latest
    ports:
      - "${UMADB_PORT:-50052}:50051"
    volumes:
      - umadb_data:/data

  federation-learning-platform:
    image: ${APP_IMAGE:-medol/federation-learning-platform:0.0.1-SNAPSHOT}
    profiles:
      - application
    depends_on:
      postgres:
        condition: service_healthy
      umadb:
        condition: service_started
    ports:
      - "${APP_PORT:-8081}:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      DB_URL: jdbc:postgresql://postgres:5432/federation_learning_platform
      DB_USERNAME: medol
      DB_PASSWORD: medol
      MEDOL_AXON_EVENT_STORAGE: ${MEDOL_AXON_EVENT_STORAGE:-umadb}
      UMADB_TARGET: ${UMADB_TARGET:-umadb:50051}
      UMADB_PLAINTEXT: ${UMADB_PLAINTEXT:-true}
      UMADB_API_KEY: ${UMADB_API_KEY:-}
      UMADB_BATCH_SIZE: ${UMADB_BATCH_SIZE:-256}
      UMADB_REQUEST_TIMEOUT: ${UMADB_REQUEST_TIMEOUT:-PT10S}
      AXON_SERVER_ENABLED: "false"
      AXON_SERVER_EVENT_STORE_ENABLED: "false"
      AXON_UPDATE_CHECK_DISABLED: ${AXON_UPDATE_CHECK_DISABLED:-true}
      RUNTIME_AGENT_URL: ${RUNTIME_AGENT_URL:-}
      FEDERATION_LEARNING_SUPPORT_URL: ${FEDERATION_LEARNING_SUPPORT_URL:-}
      FEDERATION_LEARNING_RUNTIME_AGENT_URL: ${FEDERATION_LEARNING_RUNTIME_AGENT_URL:-}

volumes:
  postgres_data:
  axon_server_data:
  axon_server_events:
  umadb_data:
