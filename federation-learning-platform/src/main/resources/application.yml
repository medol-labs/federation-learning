server:
  port: ${SERVER_PORT:8081}

spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: federation-learning-platform
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:false}
      file: ${DOCKER_COMPOSE_FILE:../docker-compose.yml}
      lifecycle-management: start-and-stop
      profiles:
        active: axon-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/federation_learning_platform}
    username: ${DB_USERNAME:medol}
    password: ${DB_PASSWORD:medol}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  flyway:
    enabled: true
    locations: classpath:db/migration

axon:
  update-check:
    disabled: ${AXON_UPDATE_CHECK_DISABLED:false}
  converter:
    general: jackson2
    messages: jackson2
    events: jackson2
  axonserver:
    enabled: ${AXON_SERVER_ENABLED:false}
    servers: ${AXON_SERVER_SERVERS:localhost:8124}
    context: ${AXON_SERVER_CONTEXT:default}
    event-store:
      enabled: ${AXON_SERVER_EVENT_STORE_ENABLED:true}

medol:
  axon:
    event-storage: ${MEDOL_AXON_EVENT_STORAGE:umadb}
    umadb:
      target: ${UMADB_TARGET:localhost:50051}
      plaintext: ${UMADB_PLAINTEXT:true}
      api-key: ${UMADB_API_KEY:}
      batch-size: ${UMADB_BATCH_SIZE:256}
      request-timeout: ${UMADB_REQUEST_TIMEOUT:PT10S}

external:
  runtime-agent:
    endpoint: ${RUNTIME_AGENT_URL:}

integration:
  federation-learning-dictionary:
    endpoint: ${FEDERATION_LEARNING_DICTIONARY_URL:}
  federation-learning-runtime-agent:
    endpoint: ${FEDERATION_LEARNING_RUNTIME_AGENT_URL:}

platform:
  runtime:
    docker-compose:
      enabled: ${PLATFORM_RUNTIME_DOCKER_COMPOSE_ENABLED:true}
      compose-file: ${PLATFORM_RUNTIME_DOCKER_COMPOSE_FILE:../docker-compose.yml}
      project-name: ${PLATFORM_RUNTIME_DOCKER_COMPOSE_PROJECT_NAME:}
      project-directory: ${PLATFORM_RUNTIME_DOCKER_COMPOSE_PROJECT_DIRECTORY:}
      agent-service-name: ${PLATFORM_RUNTIME_DOCKER_COMPOSE_AGENT_SERVICE:federation-learning-runtime-agent}
      agent-version: ${PLATFORM_RUNTIME_AGENT_VERSION:docker-compose}
      command-timeout: ${PLATFORM_RUNTIME_DOCKER_COMPOSE_COMMAND_TIMEOUT:PT60S}
    k3s:
      enabled: ${PLATFORM_RUNTIME_K3S_ENABLED:true}
      kubectl-executable: ${PLATFORM_RUNTIME_K3S_KUBECTL_EXECUTABLE:kubectl}
      kubeconfig: ${PLATFORM_RUNTIME_K3S_KUBECONFIG:}
      namespace: ${PLATFORM_RUNTIME_K3S_NAMESPACE:default}
      agent-manifest-file: ${PLATFORM_RUNTIME_K3S_AGENT_MANIFEST_FILE:../k3s/runtime-agent.yaml}
      agent-deployment-name: ${PLATFORM_RUNTIME_K3S_AGENT_DEPLOYMENT:federation-learning-runtime-agent}
      agent-version: ${PLATFORM_RUNTIME_K3S_AGENT_VERSION:k3s}
      command-timeout: ${PLATFORM_RUNTIME_K3S_COMMAND_TIMEOUT:PT60S}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.axonframework: INFO
    tech.medo.runtimeprovisioning.infrastructure.secondary.runtimeinfrastructure: DEBUG
